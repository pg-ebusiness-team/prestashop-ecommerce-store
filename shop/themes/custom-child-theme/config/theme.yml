name: custom-child-theme          # musi być identyczne z nazwą katalogu
display_name: Custom Child Theme
version: 1.0.0
parent: classic                   # dziedziczenie po Classic
author:
  name: "pg-ebusiness-team"
  email: "test@example.com"
  url: "https://github.com/pg-ebusiness-team"

meta:
  compatibility:
    from: 8.2.1
    to: ~

  available_layouts:
    layout-full-width:
      name: Full Width
      description: No side columns, ideal for distraction-free pages such as product pages.
    layout-both-columns:
      name: Three Columns
      description: One large central column and 2 side columns.
    layout-left-column:
      name: Two Columns, small left column
      description: Two columns with a small left column
    layout-right-column:
      name: Two Columns, small right column
      description: Two columns with a small right column

assets:
# If you're using this theme as child and you want to load
# the parent theme assets, uncomment this line.
  use_parent_assets: true         #odkomentowane - używa css i js classic

# The following lines are showing how to load assets in your page
# Uncomment and change value to start loading css or js files
#  css:
#  all:
#    - id: custom-lib-style
#    path: assets/css/custom-lib.css
#  product:
#    - id: product-style
#    path: assets/css/product.css
#    media: all
#    priority: 200
#  js:
#  cart:
#    - id: cat-extra-lib
#    path: assets/js/cart-lib.js


global_settings:
  configuration:
    PS_IMAGE_QUALITY: png
  modules:
    to_enable:
      - ps_linklist
    to_disable:
      - ps_banner                 # oba banery są w ps_customtext (deploy/init/theme.sql)
      - ps_categorytree           # drzewa kategorii nie ma w źródle; moduł spoza theme.yml zostałby w starym hooku
      # Strona produktu i koszyk jak w źródle: bez opinii, przycisków udostępniania i bloku „Security/Delivery policy”
      - productcomments
      - ps_sharebuttons
      - blockreassurance
  hooks:
    modules_to_hook:
      displayAdminCustomers:
        - blockwishlist
      displayCustomerAccount:
        - blockwishlist
        - psgdpr
      displayMyAccountBlock:
        - blockwishlist
      # displayNav1/displayNav2 nieużywane - header.tpl renderuje kontakt, konto i koszyk sam
      displayTop:
        - ps_mainmenu
      #displayHome:                # kolejność jak w źródle (docs/wyglad_strony.md)
       # - ps_imageslider
        #- ps_customtext
      # Własny hook: templates/index.tpl wywołuje każdy moduł osobno (mod=...) - zakładki „W naszej ofercie” i „Kup taniej”
      displayHomeProducts:
        - ps_featuredproducts
        - ps_bestsellers
        - ps_newproducts
        - ps_specials
      displayFooterBefore:
        - ps_emailsubscription
        - ps_socialfollow
      displayFooter:
        - ps_linklist
        - ps_customeraccountlinks
        - ps_contactinfo
        - blockwishlist
      displayFooterProduct:       # „Podobne produkty” pod stroną produktu
        - ps_categoryproducts
      displayLeftColumn:          # w źródle lewa kolumna ma tylko filtry, bez drzewa kategorii
        - ps_facetedsearch
      displayContactLeftColumn:
        - ps_contactinfo
      displayContactRightColumn:
        - ps_contactinfo
      displayContactContent:
        - contactform
      displaySearch:
        - ps_searchbar
      displayOrderConfirmation2:
        - ps_featuredproducts
      displayProductActions:
        - blockwishlist

  image_types:
    cart_default:
      width: 125
      height: 125
      scope: [ products ]
    small_default:
      width: 98
      height: 98
      scope: [ products, categories, manufacturers, suppliers ]
    medium_default:
      width: 452
      height: 452
      scope: [ products, manufacturers, suppliers ]
    home_default:
      width: 250
      height: 250
      scope: [ products ]
    large_default:
      width: 800
      height: 800
      scope: [ products, manufacturers, suppliers ]
    category_default:
      width: 141
      height: 180
      scope: [ categories ]
    stores_default:
      width: 170
      height: 115
      scope: [ stores ]
  new_password_policy_feature: true

theme_settings:
  default_layout: layout-full-width
  layouts:
    category: layout-left-column
    best-sales: layout-left-column
    new-products: layout-left-column
    prices-drop: layout-left-column
    contact: layout-left-column
