services:
  shop:
    build: ../shop
    image: shop:dev
    platform: linux/amd64
    environment:
      DB_SERVER: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWD: ${MYSQL_PASSWORD}
      PS_INSTALL_AUTO: "1"
      PS_LANGUAGE: pl
      PS_COUNTRY: pl
      PS_DOMAIN: ${SERVER_NAME}:${HTTPS_PORT}
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWD}
      PS_FOLDER_ADMIN: ${ADMIN_FOLDER}
      PS_ENABLE_SSL: "1"
      MAIL_SMTP_HOST: mail # Musi być zgodne z nazwą usługi "mail" poniżej (DNS w sieci Dockera)
      MAIL_SMTP_PORT: "1025"
      # Ograniczenia dostawy (shop/scripts/configure-sales.php); zmiana: edycja + make up
      FREE_SHIPPING_THRESHOLD: "2000" # zł brutto, darmowa dostawa od tej kwoty (włącznie)
      MAX_ORDER_WEIGHT_KG: "50" # zamówienie cięższe niż limit nie ma przewoźnika
    volumes:
      # Pliki sklepu (zdjęcia, app/config/parameters.php, katalog admina, moduły). Bez wolumenu nowy kontener
      # (make down/up, make up po zmianie obrazu) nie ma parameters.php i docker_run.sh instaluje sklep od nowa
      # na istniejącej bazie. Motyw z obrazu kopiuje do wolumenu shop/init-scripts/00-sync-theme.sh.
      - shop_data:/var/www/html
    healthcheck:
      # docker_run.sh uruchamia Apache dopiero po instalacji i init-scriptach, więc odpowiedź = sklep gotowy.
      # Po HTTP sklep przekierowuje na HTTPS (302) - curl -f traktuje to jako sukces, a 5xx jako błąd.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15m # pierwsza instalacja trwa kilka minut; nieudane próby w tym czasie się nie liczą

  proxy:
    build: ./nginx
    image: proxy:dev
    platform: linux/amd64
    environment:
      SERVER_NAME: ${SERVER_NAME}
      HTTPS_PORT: ${HTTPS_PORT}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - proxy_certs:/etc/nginx/certs
    depends_on:
      - shop

  mail:
    image: axllent/mailpit:v1.32.0
    platform: linux/amd64
    ports:
      - "${MAILPIT_PORT}:8025"

  # Kontener narzędziowy (importer, scraper): nie startuje przy make up (profil), uruchamia go
  # make init / make import przez `docker compose run --rm tools ...`.
  tools:
    build:
      context: ../scraper # tylko requirements.txt, bez wyników scrapera w kontekście budowania
      dockerfile: ../deploy/tools/Dockerfile
    image: tools:dev
    platform: linux/amd64
    profiles: [tools]
    # Bez env_file: importer sam wczytuje /app/.env (load_env_file w scraper/importer/main.py) i nie nadpisuje
    # zmiennych ustawionych niżej, więc SHOP_URL i PS_SHOP_HOST z environment mają pierwszeństwo
    environment:
      # W sieci Dockera sklep jest pod nazwą usługi proxy; PrestaShop odpowiada tylko dla swojej domeny,
      # więc ją podajemy w nagłówku Host (scraper/importer/api_client.py)
      SHOP_URL: https://proxy
      PS_SHOP_HOST: ${SERVER_NAME}:${HTTPS_PORT}
      # Certyfikat sklepu jest samopodpisany (PS_VERIFY_SSL=0), więc ostrzeżenie urllib3 przy każdym zapytaniu
      # zasłaniałoby raport importu
      PYTHONWARNINGS: "ignore:Unverified HTTPS request"
    volumes:
      # Repo z hosta: importer czyta scraper_results/, zapisuje zdjęcia i scraper/importer/*_mapping.json
      - ..:/app
    depends_on:
      - proxy

  db:
    image: mysql:8.0
    platform: linux/amd64
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  shop_data:
  db_data:
  proxy_certs:
